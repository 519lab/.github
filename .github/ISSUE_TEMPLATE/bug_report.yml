name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities don't belong here. Report them privately, as the security policy describes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error message or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you used.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, and how it runs (Docker, a service, the command line, ...).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove secrets and personal data first.
      render: shell
